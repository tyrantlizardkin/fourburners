<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Live, across the kitchen</title>
</head>
<body>


<style>
body{margin:0;font-family:Inter,system-ui,sans-serif;color:#E9EDEA}
button{font-family:inherit;cursor:pointer}
.d{font-family:'IBM Plex Sans',sans-serif;font-weight:700}
.m{color:#9FB0AE}
.tr{border-radius:14px;padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.pb{height:8px;border-radius:4px;background:#1E2529;overflow:hidden}
</style>

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #1E2529; display: flex; flex-direction: column">
  <div style="background: #A6D4A0; color: #1E2529; padding: 28px 20px 20px; display: flex; flex-direction: column; gap: 10px; border-radius: 0 0 24px 24px">
    <div style="display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase"><span>Beans</span><span>0:20 · serve in 28</span></div>
    <div class="d" style="font-size: 50px; line-height: 1.02; letter-spacing: -0.01em">Trim the green beans</div>
    <div style="font-size: 17px; font-weight: 500">Snap off stem ends. Leave whole.</div>
    <div style="display: flex; align-items: baseline; gap: 10px; margin-top: 4px">
      <span class="d" style="font-size: 72px; line-height: 1; font-variant-numeric: tabular-nums">3</span>
      <span style="font-size: 20px; font-weight: 600">min left</span>
    </div>
    <div style="display: flex; gap: 10px; margin-top: 6px">
      <button style="width: 96px; height: 76px; border-radius: 18px; border: 2px solid #1E2529; background: transparent; color: #1E2529; font-size: 20px; font-weight: 600">+1 min</button>
      <button class="d" style="flex-grow: 1; height: 76px; border-radius: 18px; border: none; background: #1E2529; color: #E9EDEA; font-size: 30px">Done</button>
    </div>
  </div>

  <div style="padding: 16px; display: flex; flex-direction: column; gap: 10px; flex-grow: 1">
    <div class="tr" style="background: #504747; border: 1.5px solid #F0A08C">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <span style="font-size: 17px; font-weight: 600">Chicken · oven</span>
        <span class="d" style="font-size: 38px; line-height: 1; font-variant-numeric: tabular-nums">23:00</span>
      </div>
      <div class="pb"><div style="width: 34%; height: 8px; background: #F0A08C"></div></div>
    </div>
    <div class="tr" style="background: #414C5B; border: 1.5px solid #A3B8F0">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <span style="font-size: 17px; font-weight: 600">Rice · simmer</span>
        <span class="d" style="font-size: 38px; line-height: 1; font-variant-numeric: tabular-nums">16:00</span>
      </div>
      <div class="pb"><div style="width: 11%; height: 8px; background: #A3B8F0"></div></div>
    </div>

    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 4px">
      <div style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase" class="m">Then</div>
      <div style="font-size: 20px; font-weight: 600">Free for 11 min</div>
      <div class="m" style="font-size: 16px">Blanch the beans at 0:34</div>
    </div>
    <div style="display: flex; gap: 8px; margin-top: 8px">
      <button style="flex-grow: 1; height: 44px; border-radius: 8px; border: 1px solid #3A474F; background: transparent; font-size: 14px; font-weight: 500; color: #E9EDEA">Adjust</button>
      <button style="flex-grow: 1; height: 44px; border-radius: 8px; border: 1px solid #3A474F; background: transparent; font-size: 14px; font-weight: 500; color: #E9EDEA">Full schedule</button>
    </div>
  </div>
</div>

</body>
</html>
