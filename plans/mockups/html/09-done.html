<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Done</title>
</head>
<body>


<style>
body{margin:0;font-family:Inter,system-ui,sans-serif;color:#E9EDEA}
button{font-family:inherit;cursor:pointer}
.d{font-family:'IBM Plex Sans',sans-serif;font-weight:700}
.k{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#9FB0AE}
.m{color:#9FB0AE}
.st{background:#283136;border-radius:10px;padding:12px 14px}
.rc{display:flex;align-items:center;gap:12px;width:100%;box-sizing:border-box;min-height:56px;padding:8px 14px;background:#283136;border:none;border-radius:12px;color:#E9EDEA;text-align:left}
.bar{flex:none;width:5px;align-self:stretch;border-radius:3px}
</style>

<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 28px 16px 20px; background: #1E2529; display: flex; flex-direction: column; gap: 16px">
  <div style="margin-top: 40px">
    <div style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #8FD0CF">7:13 PM</div>
    <div class="d" style="font-size: 44px; line-height: 1.05; margin-top: 6px">Everything is ready.</div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
    <div class="st"><div class="d" style="font-size: 24px">49 min</div><div class="m" style="font-size: 11px">took</div></div>
    <div class="st"><div class="d" style="font-size: 24px">48 min</div><div class="m" style="font-size: 11px">planned</div></div>
    <div class="st"><div class="d" style="font-size: 24px; color: #EBC38A">+1 min</div><div class="m" style="font-size: 11px">difference</div></div>
  </div>
  <div class="m" style="font-size: 13px">Started 6:24 PM. Hands busy 35 min, free 14.</div>

  <div class="k" style="margin-top: 4px">Finished</div>
  <div style="display: flex; flex-direction: column; gap: 8px">
    <button class="rc"><span class="bar" style="background: #A6D4A0"></span><span style="flex-grow: 1"><span style="display: block; font-size: 15px; font-weight: 600">Green beans</span><span class="m" style="display: block; font-size: 12px">off the heat 7:08 PM</span></span><span class="m" aria-hidden="true" style="font-size: 20px">›</span></button>
    <button class="rc"><span class="bar" style="background: #A3B8F0"></span><span style="flex-grow: 1"><span style="display: block; font-size: 15px; font-weight: 600">Rice pilaf</span><span class="m" style="display: block; font-size: 12px">fluffed 7:12 PM</span></span><span class="m" aria-hidden="true" style="font-size: 20px">›</span></button>
    <button class="rc"><span class="bar" style="background: #F0A08C"></span><span style="flex-grow: 1"><span style="display: block; font-size: 15px; font-weight: 600">Chicken thighs</span><span class="m" style="display: block; font-size: 12px">rested 7:13 PM</span></span><span class="m" aria-hidden="true" style="font-size: 20px">›</span></button>
  </div>
  <div class="m" style="font-size: 13px">All three were ready within 5 minutes of each other.</div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px">
    <button style="height: 52px; border-radius: 12px; border: none; background: #8FD0CF; color: #1E2529; font-size: 16px; font-weight: 600">Close</button>
    <div class="m" style="font-size: 12px; text-align: center">Closing clears this cook. The plan is not kept.</div>
  </div>
</div>

</body>
</html>
