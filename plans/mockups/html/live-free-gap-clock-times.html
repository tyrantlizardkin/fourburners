<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Live, free gap with clock times</title>
</head>
<body>


<style>
body{margin:0;font-family:Inter,system-ui,sans-serif;color:#E9EDEA}
button{font-family:inherit;cursor:pointer}
.d{font-family:'IBM Plex Sans',sans-serif;font-weight:700}
.k{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#9FB0AE}
.m{color:#9FB0AE}
.nx{display:flex;align-items:center;gap:12px;height:50px;box-sizing:border-box;background:#283136;border-radius:10px;padding:0 14px;font-size:14px}
.l{position:absolute;height:10px;box-sizing:border-box;border-radius:3px}
</style>

<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 20px 16px; background: #1E2529; display: flex; flex-direction: column; gap: 13px">
  <div style="display: flex; justify-content: space-between; align-items: flex-end">
    <div class="d" style="font-size: 22px">Cooking · 6:49 PM</div>
    <div class="m" style="font-size: 12px">serve at 7:12 PM</div>
  </div>

  <div style="border: 1.5px dashed #3A474F; border-radius: 14px; padding: 18px 20px">
    <div class="k">Now</div>
    <div class="d" style="font-size: 30px; line-height: 1.15; margin-top: 6px">Nothing needs you</div>
    <div class="m" style="font-size: 14px; margin-top: 6px">Next step in <span style="color: #E9EDEA; font-weight: 600; font-variant-numeric: tabular-nums">9:00</span>, at 6:58 PM</div>
    <div style="margin-top: 12px"><button style="height: 44px; padding: 0 16px; border-radius: 22px; border: 1.5px solid #8FD0CF; background: transparent; color: #8FD0CF; font-size: 14px; font-weight: 600">Start next early</button></div>
  </div>

  <div class="k">Running without you</div>
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <div style="background: #504747; border: 1.5px solid #F0A08C; border-radius: 12px; padding: 12px 14px">
      <div style="font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 4px; background: #F0A08C"></span>Chicken · oven</div>
      <div class="d" style="font-size: 28px; font-variant-numeric: tabular-nums">18:00</div>
      <div class="m" style="font-size: 12px">until 7:07 PM</div>
    </div>
    <div style="background: #414C5B; border: 1.5px solid #A3B8F0; border-radius: 12px; padding: 12px 14px">
      <div style="font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 4px; background: #A3B8F0"></span>Rice · simmer</div>
      <div class="d" style="font-size: 28px; font-variant-numeric: tabular-nums">11:00</div>
      <div class="m" style="font-size: 12px">until 7:00 PM</div>
    </div>
  </div>

  <div class="k">Next</div>
  <div style="display: flex; flex-direction: column; gap: 6px">
    <div class="nx" style="border-left: 5px solid #A6D4A0"><span class="m" style="width: 56px; font-size: 12px">6:58 PM</span><span style="flex-grow: 1; font-weight: 500">Blanch the beans</span><span class="m" style="font-size: 12px">4 min</span></div>
    <div class="nx" style="border-left: 5px solid #A3B8F0"><span class="m" style="width: 56px; font-size: 12px">7:00 PM</span><span style="flex-grow: 1; font-weight: 500">Rice off heat, lid on</span><span class="m" style="font-size: 12px">timer</span></div>
    <div class="nx" style="border-left: 5px solid #A6D4A0"><span class="m" style="width: 56px; font-size: 12px">7:02 PM</span><span style="flex-grow: 1; font-weight: 500">Sauté with garlic, lemon</span><span class="m" style="font-size: 12px">5 min</span></div>
  </div>

  <div style="margin-top: auto; background: #283136; border-radius: 12px; padding: 14px 23px">
    <div style="position: relative; width: 312px; height: 46px">
      <div class="l" style="top: 0; left: 0; width: 52px; background: #F0A08C"></div>
      <div class="l" style="top: 0; left: 52px; width: 228px; background: #504747; border: 1.5px solid #F0A08C"></div>
      <div class="l" style="top: 0; left: 280px; width: 6px; background: #F0A08C"></div>
      <div class="l" style="top: 0; left: 286px; width: 26px; background: #504747; border: 1.5px solid #F0A08C"></div>
      <div class="l" style="top: 18px; left: 52px; width: 65px; background: #A3B8F0"></div>
      <div class="l" style="top: 18px; left: 117px; width: 117px; background: #414C5B; border: 1.5px solid #A3B8F0"></div>
      <div class="l" style="top: 18px; left: 236px; width: 64px; background: #414C5B; border: 1.5px solid #A3B8F0"></div>
      <div class="l" style="top: 18px; left: 301px; width: 6px; background: #A3B8F0"></div>
      <div class="l" style="top: 36px; left: 117px; width: 32px; background: #A6D4A0"></div>
      <div class="l" style="top: 36px; left: 221px; width: 58px; background: #A6D4A0"></div>
      <div style="position: absolute; top: -6px; left: 162px; width: 2px; height: 58px; background: #8FD0CF"></div>
    </div>
    <div class="m" style="display: flex; justify-content: space-between; font-size: 11px; margin-top: 8px"><span>6:24 PM</span><span>now</span><span>7:12 PM</span></div>
  </div>

  <div style="display: flex; gap: 8px">
    <button style="flex-grow: 1; height: 44px; border-radius: 8px; border: 1px solid #3A474F; background: transparent; font-size: 14px; font-weight: 500; color: #E9EDEA">Adjust</button>
    <button style="flex-grow: 1; height: 44px; border-radius: 8px; border: 1px solid #3A474F; background: transparent; font-size: 14px; font-weight: 500; color: #E9EDEA">Full schedule</button>
  </div>
</div>

</body>
</html>
